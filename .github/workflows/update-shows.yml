name: Update show data

on:
  schedule:
    # 10:00 UTC daily = 6:00am ET (5am during EST) — runs before most people are checking the site
    - cron: '0 10 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm install

      - name: Run scraper
        working-directory: scraper
        run: node scrape.js

      - name: Commit updated data if changed
        run: |
          git config user.name "standing-room-society-bot"
          git config user.email "actions@github.com"
          git add data/shows.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update show data $(date -u +%Y-%m-%d)"
          git push
